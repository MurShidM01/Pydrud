[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pydrud"
version = "2.1.1"
description = "A Flutter-inspired Python UI framework with a toolchain-free Pydash host preview and an optional Chaquopy Android APK target."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Pydrud Contributors"}
]
keywords = [
    "cross-platform", "pydash", "chaquopy", "android", "framework", "ui",
    "mobile", "python", "app-development",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Java",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: User Interfaces",
    "Framework :: Setuptools Plugin",
    "Natural Language :: English",
]

dependencies = [
    "click>=8.0",
    "Jinja2>=3.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
# Optional third-party QR encoder. Pydrud ships its own pure-Python encoder,
# so this is only needed to reproduce the exact output of older releases.
qr = ["qrcode>=7.4"]
# Faster, event-driven file watching for hot reload / watch mode.
watch = ["watchdog>=3.0"]
# Everything needed to run the test suite.
dev = [
    "pytest>=7.0",
    "javalang>=0.13",
    "watchdog>=3.0",
    # Without fonttools the icon-generator drift test skips itself, so CI
    # would quietly stop checking the committed Java against the generator.
    "fonttools>=4.0",
]

[project.urls]
Homepage = "https://github.com/MurShidM01/Pydrud"
Repository = "https://github.com/MurShidM01/Pydrud"
Documentation = "https://github.com/MurShidM01/Pydrud#readme"
"Bug Tracker" = "https://github.com/MurShidM01/Pydrud/issues"

[project.scripts]
pydrud = "pydrud.commands.cli:main"

[tool.setuptools.packages.find]
include = ["pydrud*"]

[tool.setuptools.package-data]
"pydrud" = ["android/templates/**/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
# One place to change the lint gate; CI runs plain `ruff check .`.
target-version = "py310"
line-length = 100
extend-exclude = ["build", "dist", "*.egg-info"]

[tool.ruff.lint]
# Errors and undefined names only. The suite is the contract for behaviour,
# so Ruff stays a fast syntax/static-error gate rather than a style arbiter:
# a growing rule set would turn unrelated refactors into CI failures.
select = ["F", "E9"]

