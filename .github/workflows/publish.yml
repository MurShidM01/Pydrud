name: Publish

# One release, one version, both places. Publishing a GitHub Release is the
# only action that ships: this workflow builds the distributions, uploads
# them to PyPI over OIDC and attaches the same files to the release, so the
# tag, the PyPI version and the release assets cannot drift apart.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Kept in step with ci.yml: one place to bump the interpreter.
  PYTHON_VERSION: "3.13"

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The version travels with the artifacts so the publish job can ask PyPI
    # whether it already has this release without checking out the repository.
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The release tag and the package version must agree. Without this the
      # two sides silently diverge: a tag of v2.1.6 over a pyproject still
      # reading 2.1.5 either publishes the wrong version to PyPI or fails
      # there with "File already exists".
      - name: Verify the tag matches the package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "release tag: $RELEASE_TAG   package version: $version"
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "::error::release tag $RELEASE_TAG does not match pyproject version $version"
            exit 1
          fi

      - name: Read the package version
        id: version
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build sdist and wheel
        run: |
          python -m pip install -U pip build
          python -m build

      # A wheel that ships without android/templates/** installs cleanly and
      # then cannot scaffold anything, so refuse to publish one.
      - name: Verify the templates ship in the wheel
        run: python tools/check_wheel.py

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.build.outputs.version }}
    # Must match the environment named on the PyPI trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/p/pydrud
    # Trusted publishing: no API token is stored anywhere. The id-token
    # permission lets the action exchange the workflow's OIDC identity for a
    # short-lived PyPI credential. Remove it and the upload 403s.
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      # A release is only ever half-published: PyPI can succeed while the
      # asset upload fails. Re-running the workflow then must not die on
      # "File already exists", so an upload that already happened is skipped.
      - name: Check whether PyPI already has this version
        id: pypi
        run: |
          if curl -fsS "https://pypi.org/pypi/pydrud/$VERSION/json" > /dev/null; then
            echo "pydrud $VERSION is already on PyPI; skipping the upload"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # PyPI versions are immutable, so a duplicate version fails here rather
      # than being overwritten.
      - name: Publish to PyPI
        if: steps.pypi.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1

  attach:
    name: Attach artifacts to the release
    needs: [build, publish]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      # --clobber keeps a re-run idempotent: the CI-built files replace any
      # earlier ones, so the release always carries exactly what PyPI got.
      #
      # --repo is required: this job never checks out the repository, so gh has
      # no git remote to infer the repository from and exits with
      # "fatal: not a git repository".
      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
